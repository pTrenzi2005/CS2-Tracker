# Terraform for PROD. Pull requests plan both stacks, a merge to main applies them in order.
# infra/dev and infra/bootstrap stay local: the Terraform identity has no access to DEV.
name: Infra

on:
  pull_request:
    branches: [main]
    paths:
      - infra/azure/**
      - infra/databricks/**
      - infra/backend.hcl
      - .github/workflows/infra.yml
  push:
    branches: [main]
    paths:
      - infra/azure/**
      - infra/databricks/**
      - infra/backend.hcl
      - .github/workflows/infra.yml

permissions:
  contents: read
  id-token: write

# Plans, applies, and the nightly drift check wait for the state lock (-lock-timeout) instead of failing on it.
env:
  TERRAFORM_VERSION: 1.17.0

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Terraform plan (${{ matrix.stack }})
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stack: [azure, databricks]
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive infra

      - name: Init
        working-directory: infra/${{ matrix.stack }}
        run: terraform init -input=false -backend-config=../backend.hcl

      - name: Validate
        working-directory: infra/${{ matrix.stack }}
        run: terraform validate -no-color

      # infra/databricks reads the applied infra/azure state, not this pull request's azure plan.
      - name: Plan
        working-directory: infra/${{ matrix.stack }}
        run: |
          terraform plan -input=false -no-color -lock-timeout=10m | tee plan.txt
          {
            echo "### Terraform plan: ${{ matrix.stack }}"
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Terraform apply
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: infra
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # infra/databricks reads the outputs of infra/azure, so azure goes first.
      - name: Apply azure
        working-directory: infra/azure
        run: |
          terraform init -input=false -backend-config=../backend.hcl
          terraform apply -input=false -auto-approve -no-color -lock-timeout=10m

      - name: Apply databricks
        working-directory: infra/databricks
        run: |
          terraform init -input=false -backend-config=../backend.hcl
          terraform apply -input=false -auto-approve -no-color -lock-timeout=10m
