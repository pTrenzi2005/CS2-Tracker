command: ["streamlit", "run", "app.py"]

# valueFrom names are the resource keys in databricks/resources/cs2_tracker.app.yml.
env:
  - name: STREAMLIT_GATHER_USAGE_STATS
    value: "false"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: CS2_REFERENCE_JOB_ID
    valueFrom: reference-job
  - name: CS2_ANALYSIS_JOB_ID
    valueFrom: analysis-job
  - name: CS2_RAW_VOLUME
    valueFrom: raw-volume
  - name: CS2_DIM_MATCH
    valueFrom: dim-match
  - name: CS2_DIM_ROUND
    valueFrom: dim-round
  - name: CS2_AGG_MATCH_SUMMARY
    valueFrom: agg-match-summary
  - name: CS2_FACT_ROUND_STATS
    valueFrom: fact-round-stats
  - name: CS2_FACT_PLAYER_POSITIONS
    valueFrom: fact-player-positions
  - name: CS2_FACT_KILLS
    valueFrom: fact-kills
  - name: CS2_FACT_DEATHS
    valueFrom: fact-deaths
  - name: CS2_FACT_DAMAGE
    valueFrom: fact-damage
  - name: CS2_DIM_MAP_REFERENCE
    valueFrom: dim-map-reference
  - name: CS2_DIM_MAP_LEVEL
    valueFrom: dim-map-level
  - name: CS2_DIM_WEAPON_SPEC
    valueFrom: dim-weapon-spec
