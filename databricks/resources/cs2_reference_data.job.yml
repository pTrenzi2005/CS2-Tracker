# Paths are relative to this file.
# No schedule: run the job again after a game update.

resources:
  jobs:
    cs2_reference_data:
      name: cs2_reference_data_ingest
      description: >-
        Reference data ingest (maps, radars, weapon stats) through bronze,
        silver, and gold. Run again after a game update.
      max_concurrent_runs: 1

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: map_icons_repo
          default: MurkyYT/cs2-map-icons
        - name: map_icons_ref
          default: main
        - name: kaggle_dataset
          default: billpureskillgg/cs2-weapon-spreadsheet
        - name: download_images
          default: "true"
        - name: secret_scope
          default: ${var.secret_scope}

      tasks:
        - task_key: download
          description: Download source files into the bronze.raw volume and write the manifest.
          notebook_task:
            notebook_path: ../batch/download_reference_data.py

        - task_key: bronze
          description: Volume to bronze.map_icons_raw, weapon_spreadsheet_raw, and map_assets_raw.
          depends_on:
            - task_key: download
          notebook_task:
            notebook_path: ../batch/bronze_reference_data.py

        - task_key: silver
          description: Parse the map manifest, overview files, and the weapon sheet.
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../batch/silver_reference_data.py

        - task_key: gold
          description: Reference dimensions.
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../batch/gold_reference_data.py

        - task_key: validate
          description: Unique keys and map, level, and zone consistency.
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../batch/validate_reference_data.py

      queue:
        enabled: true
