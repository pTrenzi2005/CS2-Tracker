# Serverless warehouse for the app's dashboard queries. Stops after 10 idle minutes.

resources:
  sql_warehouses:
    cs2_app_warehouse:
      name: cs2-tracker-app
      cluster_size: 2X-Small
      enable_serverless_compute: true
      warehouse_type: PRO
      min_num_clusters: 1
      max_num_clusters: 1
      auto_stop_mins: 10
