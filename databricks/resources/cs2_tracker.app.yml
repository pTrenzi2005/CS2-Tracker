# Paths are relative to this file.
# SELECT on gold comes from the schema grant in cs2_catalog.uc.yml, so tables need not exist when the app deploys.
# config replaces app.yaml: the catalog differs per target, and app.yaml cannot read bundle variables.

resources:
  apps:
    cs2_tracker:
      name: cs2-tracker
      description: Starts the reference batch and the match analysis, then shows the match dashboards.
      source_code_path: ../../dashboards

      config:
        command: ["streamlit", "run", "app.py"]
        env:
          - name: STREAMLIT_GATHER_USAGE_STATS
            value: "false"
          - name: CS2_CATALOG
            value: ${var.catalog}
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: CS2_REFERENCE_JOB_ID
            value_from: reference-job
          - name: CS2_ANALYSIS_JOB_ID
            value_from: analysis-job

      # Volume resources also grant USE CATALOG and USE SCHEMA.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${resources.sql_warehouses.cs2_app_warehouse.id}
            permission: CAN_USE
        - name: reference-job
          job:
            id: ${resources.jobs.cs2_reference_data.id}
            permission: CAN_MANAGE_RUN
        - name: analysis-job
          job:
            id: ${resources.jobs.cs2_medallion_refresh.id}
            permission: CAN_MANAGE_RUN
        - name: raw-volume
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${resources.volumes.raw.catalog_name}.${resources.volumes.raw.schema_name}.${resources.volumes.raw.name}
            permission: READ_VOLUME
