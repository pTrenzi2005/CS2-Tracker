# Paths are relative to this file.
# Every table below must exist before the first deploy of the app.
# Run cs2_medallion and cs2_reference_data once on a new catalog, then deploy again.

resources:
  apps:
    cs2_tracker:
      name: cs2-tracker
      description: Starts the reference batch and the match analysis, then shows the match dashboards.
      source_code_path: ../../dashboards

      # Keys are the valueFrom names in dashboards/app.yaml.
      # Table and volume resources also grant USE CATALOG and USE SCHEMA.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${resources.sql_warehouses.cs2_app_warehouse.id}
            permission: CAN_USE

        - name: reference-job
          job:
            id: ${resources.jobs.cs2_reference_data.id}
            permission: CAN_MANAGE_RUN
        - name: analysis-job
          job:
            id: ${resources.jobs.cs2_medallion_refresh.id}
            permission: CAN_MANAGE_RUN

        - name: raw-volume
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.catalog}.bronze.raw
            permission: READ_VOLUME

        - name: dim-match
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.dim_match
            permission: SELECT
        - name: dim-round
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.dim_round
            permission: SELECT
        - name: agg-match-summary
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.agg_match_summary
            permission: SELECT
        - name: fact-round-stats
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.fact_round_stats
            permission: SELECT
        - name: fact-player-positions
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.fact_player_positions
            permission: SELECT
        - name: fact-kills
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.fact_kills
            permission: SELECT
        - name: fact-deaths
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.fact_deaths
            permission: SELECT
        - name: fact-damage
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.fact_damage
            permission: SELECT

        - name: dim-map-reference
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.dim_map_reference
            permission: SELECT
        - name: dim-map-level
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.dim_map_level
            permission: SELECT
        - name: dim-weapon-spec
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.gold.dim_weapon_spec
            permission: SELECT
