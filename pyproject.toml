# Test and lint settings. The project itself is not a package.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "databricks/pipelines", "databricks/batch"]
markers = ["spark: needs PySpark and Java"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["python/venv"]
# Globals that Databricks injects into notebooks and pipeline sources.
builtins = ["spark", "dbutils", "display"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Notebooks import after the widget cell.
"databricks/batch/*_reference_data.py" = ["E402"]
